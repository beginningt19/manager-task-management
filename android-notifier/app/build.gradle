plugins {
    id 'com.android.application'
}

def firebaseProjectId = project.findProperty('YAVLENA_FIREBASE_PROJECT_ID') ?: 'yavlena-manager-tasks'
def firebaseAppId = project.findProperty('YAVLENA_FIREBASE_APP_ID') ?: '1:685357948781:android:107f2bd7cd87fdcb858464'
def firebaseApiKey = project.findProperty('YAVLENA_FIREBASE_API_KEY') ?: ''
def firebaseSenderId = project.findProperty('YAVLENA_FIREBASE_SENDER_ID') ?: '685357948781'

android {
    namespace 'com.yavlena.managertasks.notifier'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yavlena.managertasks.notifier'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'

        resValue 'string', 'google_app_id', firebaseAppId
        resValue 'string', 'google_api_key', firebaseApiKey
        resValue 'string', 'gcm_defaultSenderId', firebaseSenderId
        resValue 'string', 'project_id', firebaseProjectId
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-messaging'
}
