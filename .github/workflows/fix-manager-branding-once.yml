name: Fix Manager branding once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Admin heading with Manager heading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'Административни задачи'
          new = 'Управленски задачи'
          count = s.count(old)
          if count == 0:
              raise SystemExit('Target text not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print(f'Replaced {count} occurrence(s)')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-manager-branding-once.yml
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/fix-manager-branding-once.yml
          git commit -m "Rename Manager UI headings"
          git push
