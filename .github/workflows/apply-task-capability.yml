name: Apply task capability frontend

on:
  push:
    paths:
      - '.github/workflows/apply-task-capability.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch task access capability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          s = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "    const byId = new Map(nextProfiles.map((person) => [person.id, person]))\n\n    const visibleTaskIds = new Set(",
                  "    const byId = new Map(nextProfiles.map((person) => [person.id, person]))\n    const currentProfile = byId.get(session.user.id) || null\n    const hasFullTaskAccess = Boolean(currentProfile?.display_role === 'Управител' || currentProfile?.can_manage_all_tasks)\n\n    const visibleTaskIds = new Set("
              ),
              (
                  "    const scopedTasks = rawTasks.filter((task) => visibleTaskIds.has(task.id))\n\n    setProfiles(nextProfiles)\n    setProfile(byId.get(session.user.id) || null)",
                  "    const scopedTasks = hasFullTaskAccess\n      ? rawTasks\n      : rawTasks.filter((task) => visibleTaskIds.has(task.id))\n\n    setProfiles(nextProfiles)\n    setProfile(currentProfile)"
              ),
              (
                  "  const isGovernor = profile?.display_role === 'Управител'",
                  "  const hasFullTaskAccess = profile?.display_role === 'Управител' || Boolean(profile?.can_manage_all_tasks)"
              ),
              (
                  "getViewerTaskStatus(task, session?.user.id, isGovernor)",
                  "getViewerTaskStatus(task, session?.user.id, hasFullTaskAccess)"
              ),
              (
                  "getTaskCategory(task, session?.user.id, isGovernor)",
                  "getTaskCategory(task, session?.user.id, hasFullTaskAccess)"
              ),
              (
                  "      : isGovernor\n        ? filteredTasks",
                  "      : hasFullTaskAccess\n        ? filteredTasks"
              ),
              (
                  "[categoryFocus, filteredTasks, isGovernor, session?.user.id]",
                  "[categoryFocus, filteredTasks, hasFullTaskAccess, session?.user.id]"
              ),
              (
                  "  const canCreateTeamTasks = profile?.display_role === 'Управител'",
                  "  const canCreateTeamTasks = hasFullTaskAccess"
              ),
              (
                  "sharedGovernorView={isGovernor}",
                  "sharedGovernorView={hasFullTaskAccess}"
              ),
              (
                  "  const isGovernor = currentUser?.display_role === 'Управител'",
                  "  const hasFullTaskAccess = currentUser?.display_role === 'Управител' || Boolean(currentUser?.can_manage_all_tasks)\n  const isGovernor = currentUser?.display_role === 'Управител'"
              ),
              (
                  "getViewerTaskStatus(task, currentUser.id, isGovernor)",
                  "getViewerTaskStatus(task, currentUser.id, hasFullTaskAccess)"
              ),
              (
                  "            {isGovernor && (\n              <div className=\"assignee-status-section\">",
                  "            {hasFullTaskAccess && (\n              <div className=\"assignee-status-section\">"
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count == 0:
                  raise SystemExit(f'Missing expected App.tsx fragment: {old[:120]!r}')
              s = s.replace(old, new)

          # Dependency arrays use the renamed task-access flag.
          s = s.replace("session?.user.id, isGovernor])", "session?.user.id, hasFullTaskAccess])")

          # Approval decisions remain restricted to the actual Управител.
          if "approval.status === 'pending' && currentUser.display_role === 'Управител'" not in s:
              raise SystemExit('Governor-only approval guard changed unexpectedly')

          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit frontend capability support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --check
          git commit -m "Honor full task access capability in dashboard"
          git push origin HEAD:main
