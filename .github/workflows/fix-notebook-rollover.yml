name: Fix notebook rollover

on:
  push:
    paths:
      - '.github/workflows/fix-notebook-rollover.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch notebook rollover frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/NotebookDrawer.tsx')
          s = path.read_text(encoding='utf-8')
          old = """    // Rollover is only allowed for a selected day that is already in the past.\n    // Never call the RPC for today or for any future date.\n    if (selectedDate >= today) {\n      rolloverDateRef.current = selectedDate\n      return\n    }"""
          new = """    // Rollover may target today so yesterday's unfinished entries can move forward.\n    // Never call the RPC for a future date.\n    if (selectedDate > today) {\n      rolloverDateRef.current = selectedDate\n      return\n    }"""
          if old not in s:
              raise SystemExit('Expected notebook rollover guard was not found')
          path.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Add tracked Supabase migration
        shell: bash
        run: |
          cat > supabase/migrations/20261014131500_allow_notebook_rollover_into_today.sql <<'SQL'
          create or replace function public.rollover_notebook_day(p_date date)
          returns integer
          language plpgsql
          security invoker
          set search_path = public
          as $function$
          declare
            v_user uuid := auth.uid();
            v_previous_date date;
            v_today date := (now() at time zone 'Europe/Sofia')::date;
            v_target_page_id uuid;
            v_next_position integer;
            v_inserted integer := 0;
          begin
            if v_user is null then
              raise exception 'Authentication required';
            end if;

            if p_date is null then
              raise exception 'Date is required';
            end if;

            -- Today is a valid rollover target (yesterday -> today).
            -- Only future target dates are rejected.
            if p_date > v_today then
              return 0;
            end if;

            v_previous_date := p_date - 1;

            if not exists (
              select 1
              from public.notebook_entries e
              join public.notebook_pages p on p.id = e.page_id
              where e.user_id = v_user
                and p.user_id = v_user
                and p.page_date = v_previous_date
                and e.completed = false
                and e.source_task_id is null
            ) then
              return 0;
            end if;

            perform pg_advisory_xact_lock(
              hashtextextended(v_user::text || ':notebook-rollover:' || p_date::text, 0)
            );

            select p.id
            into v_target_page_id
            from public.notebook_pages p
            where p.user_id = v_user
              and p.page_date = p_date
              and p.page_number = 1
            limit 1;

            if v_target_page_id is null then
              insert into public.notebook_pages(user_id, page_date, page_number)
              values (v_user, p_date, 1)
              on conflict (user_id, page_date, page_number) do nothing;

              select p.id
              into v_target_page_id
              from public.notebook_pages p
              where p.user_id = v_user
                and p.page_date = p_date
                and p.page_number = 1
              limit 1;
            end if;

            select coalesce(max(e.position), -1) + 1
            into v_next_position
            from public.notebook_entries e
            where e.page_id = v_target_page_id
              and e.user_id = v_user;

            with source_entries as (
              select
                e.id,
                e.body,
                e.scheduled_time,
                e.end_time,
                row_number() over (
                  order by p.page_number, e.position, e.created_at, e.id
                ) - 1 as offset_position
              from public.notebook_entries e
              join public.notebook_pages p on p.id = e.page_id
              where e.user_id = v_user
                and p.user_id = v_user
                and p.page_date = v_previous_date
                and e.completed = false
                and e.source_task_id is null
                and not exists (
                  select 1
                  from public.notebook_entries existing
                  where existing.user_id = v_user
                    and existing.page_id = v_target_page_id
                    and existing.carried_from_entry_id = e.id
                )
            )
            insert into public.notebook_entries(
              page_id,
              user_id,
              body,
              completed,
              position,
              scheduled_time,
              end_time,
              carried_from_entry_id,
              carried_from_date
            )
            select
              v_target_page_id,
              v_user,
              source.body,
              false,
              v_next_position + source.offset_position,
              source.scheduled_time,
              source.end_time,
              source.id,
              v_previous_date
            from source_entries source
            on conflict do nothing;

            get diagnostics v_inserted = row_count;
            return v_inserted;
          end;
          $function$;
          SQL

      - name: Verify build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NotebookDrawer.tsx supabase/migrations/20261014131500_allow_notebook_rollover_into_today.sql
          git diff --cached --check
          git commit -m "Fix notebook rollover into current day"
          git push origin HEAD:main
