name: Build Manager Android notifier

on:
  push:
    branches: [main]
    paths:
      - 'android-notifier/**'
      - '.github/workflows/build-manager-android-notifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable APK
        run: gradle -p android-notifier :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp android-notifier/app/build/outputs/apk/debug/app-debug.apk YavlenaManagerNotifier-android-v1.3.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YavlenaManagerNotifier-android-v1.3.0
          path: YavlenaManagerNotifier-android-v1.3.0.apk
          if-no-files-found: error
