name: Build Manager Android notifier

on:
  push:
    branches: [main]
    paths:
      - 'android-notifier/**'
      - '.github/workflows/build-manager-android-notifier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable APK
        run: gradle -p android-notifier :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp android-notifier/app/build/outputs/apk/debug/app-debug.apk YavlenaManagerNotifier-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YavlenaManagerNotifier-android
          path: YavlenaManagerNotifier-android.apk
          if-no-files-found: error
