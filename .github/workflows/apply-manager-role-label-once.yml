name: Apply Manager role label once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-role-label:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch role label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          old = "<small>{profile?.role === 'manager' ? 'Управител' : 'Администрация'}</small>"
          new = "<small>{profile?.display_role || (profile?.role === 'manager' ? 'Мениджър' : 'Модератор')}</small>"
          if old not in s:
              raise SystemExit('Role label target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-manager-role-label-once.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/apply-manager-role-label-once.yml
          git commit -m "Show Manager display roles"
          git push
