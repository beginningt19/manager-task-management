name: Bootstrap Manager Source

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-manager-source.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
      - name: Download exact source export
        run: |
          curl -L --fail 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-9840-81f4-a3b3-4c5533a2a184/raw?se=2026-09-17T15%3A10%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=b9e6e176-3aa9-50be-9e2a-36f4743deca9&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T15%3A01%3A35Z&ske=2026-09-18T15%3A01%3A35Z&sks=b&skv=2026-02-06&sig=ZxQjc9UbjxAdsshdfFqNnkYaqFhSnNIWRGWJPnb7zu4%3D' -o /tmp/manager-source.zip
          unzip -q /tmp/manager-source.zip -d /tmp/manager-artifact
          tar -xzf /tmp/manager-artifact/manager-source.tar.gz -C .
      - name: Remove bootstrap workflow and commit exact clone
        run: |
          rm -f .github/workflows/bootstrap-manager-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clone current Admin Task web frontend exactly'
          git push
